name: CI/CD Pipeline & VPS Auto-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ========================================================
  # JOB 1: Continuous Integration & Automated Testing
  # ========================================================
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, curl, bcmath, zip
          coverage: none

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Environment File & Install Composer Dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan key:generate

      - name: Install Frontend Dependencies & Build Assets
        run: |
          npm ci
          npm test --if-present
          npm run build

      - name: Execute Automated Test Suite
        run: php artisan test --compact

  # ========================================================
  # JOB 2: Auto-Deploy to Production VPS
  # ========================================================
  deploy:
    name: Deploy to Production VPS
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Connect to VPS and Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '43.157.230.29' }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER || 'ubuntu' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 20m
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Terhubung ke VPS: $(hostname)"
            echo "👤 User aktif: $(whoami)"

            # 1. Tentukan target direktori aplikasi di CloudPanel / VPS
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              for candidate in \
                "/home/unique-monsters-ewarga/htdocs/e-warga.unique-monsters.my.id" \
                "/home/unique-monsters/htdocs/e-warga.unique-monsters.my.id" \
                "/htdocs/e-warga.unique-monsters.my.id" \
                "/var/www/e-warga.unique-monsters.my.id"; do
                if sudo test -d "$candidate" 2>/dev/null; then
                  APP_DIR="$candidate"
                  break
                fi
              done
            fi

            if [ -z "$APP_DIR" ] || ! sudo test -d "$APP_DIR"; then
              APP_DIR=$(sudo find /home /htdocs /var/www -maxdepth 3 -name "e-warga.unique-monsters.my.id" 2>/dev/null | head -n 1)
            fi

            echo "📂 Target direktori: $APP_DIR"
            if [ -z "$APP_DIR" ] || ! sudo test -d "$APP_DIR"; then
              echo "❌ Error: Direktori aplikasi tidak ditemukan di VPS!"
              exit 1
            fi

            # 2. Deteksi owner direktori aplikasi (misal unique-monsters-ewarga)
            APP_OWNER=$(sudo stat -c '%U' "$APP_DIR" 2>/dev/null || echo "unique-monsters-ewarga")
            echo "👤 Pemilik folder aplikasi: $APP_OWNER"

            # 3. Pastikan izin akses folder parent agar dapat diakses
            PARENT_DIR=$(dirname "$APP_DIR")
            GRANDPARENT_DIR=$(dirname "$PARENT_DIR")
            sudo chmod +x "$PARENT_DIR" 2>/dev/null || true
            sudo chmod +x "$GRANDPARENT_DIR" 2>/dev/null || true

            # 4. Daftarkan safe.directory git untuk user root dan ubuntu
            sudo git config --global --add safe.directory "$APP_DIR" || true
            git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true

            # 5. Jalankan deployment terisolasi dengan sudo
            sudo bash -c "
              set -e
              cd '$APP_DIR'

              echo '📥 Menarik kode terbaru dari branch main...'
              git config core.fileMode false
              git pull origin main

              echo '📦 Menginstall dependensi Composer...'
              composer install --no-dev --optimize-autoloader --no-interaction

              echo '🗄️ Menjalankan migrasi database...'
              php artisan migrate --force

              echo '🎨 Mengompilasi aset frontend (Vite)...'
              if command -v npm >/dev/null 2>&1; then
                npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund
                npm run build
              fi

              echo '⚡ Menyegarkan cache sistem Laravel...'
              php artisan optimize:clear
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache

              echo '🔗 Memastikan storage link...'
              php artisan storage:link 2>/dev/null || true

              echo '🔐 Menyesuaikan hak kepemilikan dan permission...'
              chown -R $APP_OWNER:$APP_OWNER '$APP_DIR'
              chmod -R 775 '$APP_DIR/storage' '$APP_DIR/bootstrap/cache' 2>/dev/null || true
            "

            echo "=========================================================="
            echo "🎉 [CI/CD] DEPLOYMENT BERHASIL! E-WARGA telah live di VPS."
            echo "=========================================================="
