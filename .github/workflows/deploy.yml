name: CI/CD Pipeline & Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ========================================================
  # JOB 1: Continuous Integration & Automated Testing
  # ========================================================
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, curl, bcmath, zip
          coverage: none

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Environment File & Install Composer Dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan key:generate

      - name: Install Frontend Dependencies & Build Assets
        run: |
          npm ci
          npm test --if-present
          npm run build

      - name: Execute Automated Test Suite
        run: php artisan test --compact

  # ========================================================
  # JOB 2: Production Readiness Verification & Webhook Trigger
  # ========================================================
  production-readiness:
    name: Production Release Ready
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Webhook Auto-Deploy (Optional HTTPS Sync)
        run: |
          echo "🌐 Memeriksa kesiapan sinkronisasi web produksi..."
          TOKEN="${{ secrets.DEPLOY_TOKEN || 'ewarga-secret-deploy-token-2026' }}"
          HTTP_STATUS=$(curl -s -k -o /tmp/deploy_res.json -w "%{http_code}" -X POST "https://e-warga.unique-monsters.my.id/api/v1/system/deploy-webhook" \
            -H "X-Deploy-Token: $TOKEN" || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "🎉 Webhook Deploy Berhasil! Web produksi otomatis tersinkronisasi."
          else
            echo "ℹ️ Kode aplikasi sudah 100% siap di GitHub. Admin dapat menarik pembaruan (git pull) di VPS kapan saja."
          fi

      - name: Release Summary
        run: |
          echo "=========================================================="
          echo "🎉 [E-WARGA] SELURUH KODE & BUILD SIAP PRODUKSI (100% LULUS)!"
          echo "🔗 Repository: https://github.com/FabianOminkk/e-warga"
          echo "🌐 Live URL  : https://e-warga.unique-monsters.my.id"
          echo "=========================================================="
