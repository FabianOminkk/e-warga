name: CI/CD Pipeline & Turbo VPS Auto-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # SINGLE-PASS TURBO PIPELINE: TEST & DEPLOY IN ONE RUNNER
  # ========================================================
  ci-cd:
    name: Turbo Test & Auto-Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, curl, bcmath, zip
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Setup Environment File & Dependencies
        run: |
          cp .env.example .env
          if [ ! -d "vendor" ]; then
            composer install --no-interaction --prefer-dist --optimize-autoloader
          fi
          php artisan key:generate

      - name: Install Frontend Dependencies & Build Assets
        run: |
          npm ci --prefer-offline --no-audit
          npm run build

      - name: Execute Automated Test Suite
        run: php artisan test --compact

      - name: Verify SSH Credentials
        run: |
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::Secret VPS_SSH_KEY belum terpasang di GitHub Repository Secrets!"
            echo "Silakan pastikan secret VPS_SSH_KEY telah ditambahkan di https://github.com/FabianOminkk/e-warga/settings/secrets/actions"
            exit 1
          fi
          echo "✅ Secret VPS_SSH_KEY terdeteksi di GitHub Actions."

      - name: Connect to VPS and Turbo Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.157.230.29
          port: 22
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script_stop: true
          script: |
            echo "🚀 [TURBO DEPLOY] Terhubung ke VPS: $(hostname)"
            APP_DIR="/home/unique-monsters-ewarga/htdocs/e-warga.unique-monsters.my.id"

            sudo bash -c "
              set -e
              cd '$APP_DIR'

              # 1. Deteksi file yang berubah untuk eksekusi kilat (Delta Deploy)
              CHANGED=\$(git diff --name-only HEAD origin/main 2>/dev/null || echo 'all')

              # 2. Sinkronisasi kode secepat kilat
              git config core.fileMode false
              git fetch origin main --quiet
              git reset --hard origin/main --quiet

              # 3. Jalankan dependensi hanya jika berkas terkait berubah
              if echo \"\$CHANGED\" | grep -q 'composer.lock'; then
                echo '📦 Update Composer...'
                composer install --no-dev --optimize-autoloader --no-interaction --quiet
              fi

              if echo \"\$CHANGED\" | grep -q 'database/migrations'; then
                echo '🗄️ Update Database Migration...'
                php artisan migrate --force --quiet
              fi

              if echo \"\$CHANGED\" | grep -qE 'resources/|package.json'; then
                echo '🎨 Rebuild Vite Assets...'
                npm run build --silent
              fi

              # 4. Refresh cache super cepat (0.2 detik)
              php artisan optimize:clear --quiet
              php artisan config:cache --quiet
              php artisan route:cache --quiet
              php artisan view:cache --quiet

              # 5. Permission kilat (hanya folder yang perlu)
              chown -R unique-monsters-ewarga:unique-monsters-ewarga storage bootstrap/cache public/build 2>/dev/null || true
              chmod -R 775 storage bootstrap/cache 2>/dev/null || true
            "

            echo "=========================================================="
            echo "⚡ [TURBO DEPLOY] WEBSITE PRODUKSI SUDAH LIVE TERUPDATE!"
            echo "=========================================================="
