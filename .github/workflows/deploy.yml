name: CI/CD Pipeline & VPS Auto-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ========================================================
  # JOB 1: Continuous Integration & Automated Testing
  # ========================================================
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, curl, bcmath, zip
          coverage: none

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Environment File & Install Composer Dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan key:generate

      - name: Install Frontend Dependencies & Build Assets
        run: |
          npm ci
          npm test --if-present
          npm run build

      - name: Execute Automated Test Suite
        run: php artisan test --compact

  # ========================================================
  # JOB 2: Auto-Deploy to Production VPS
  # ========================================================
  deploy:
    name: Deploy to Production VPS
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Connect to VPS and Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '43.157.230.29' }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER || 'ubuntu' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 20m
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Terhubung ke VPS: $(hostname)"
            echo "👤 User aktif: $(whoami)"

            # 1. Deteksi otomatis direktori aplikasi di VPS
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              for candidate in \
                "/home/unique-monsters/htdocs/e-warga.unique-monsters.my.id" \
                "/home/*/htdocs/e-warga.unique-monsters.my.id" \
                "/htdocs/e-warga.unique-monsters.my.id" \
                "/var/www/e-warga.unique-monsters.my.id" \
                "/var/www/html"; do
                found=$(ls -d $candidate 2>/dev/null | head -n 1)
                if [ -n "$found" ] && [ -d "$found" ]; then
                  APP_DIR="$found"
                  break
                fi
              done
            fi

            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              if command -v sudo >/dev/null 2>&1; then
                APP_DIR=$(sudo find /home /htdocs /var/www -maxdepth 3 -name "e-warga.unique-monsters.my.id" 2>/dev/null | head -n 1)
              fi
            fi

            echo "📂 Target direktori: $APP_DIR"
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              echo "❌ Error: Direktori aplikasi tidak ditemukan di VPS!"
              exit 1
            fi

            cd "$APP_DIR"

            # 2. Skrip deployment
            DEPLOY_SCRIPT="
              set -e
              echo '📥 Menarik kode terbaru dari GitHub...'
              git config core.fileMode false
              git pull origin main

              echo '📦 Menginstall dependensi Composer...'
              composer install --no-dev --optimize-autoloader --no-interaction

              echo '🗄️ Menjalankan migrasi database...'
              php artisan migrate --force

              echo '🎨 Mengompilasi aset frontend (Vite)...'
              if command -v npm >/dev/null 2>&1; then
                npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund
                npm run build
              fi

              echo '⚡ Menyegarkan cache sistem...'
              php artisan optimize:clear
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache

              echo '🔗 Memastikan storage link...'
              php artisan storage:link 2>/dev/null || true
            "

            APP_OWNER=$(stat -c '%U' "$APP_DIR" 2>/dev/null || whoami)
            CURRENT_USER=$(whoami)

            if [ "$CURRENT_USER" = "$APP_OWNER" ] || [ "$CURRENT_USER" = "root" ]; then
              bash -c "$DEPLOY_SCRIPT"
            elif command -v sudo >/dev/null 2>&1; then
              echo "🛡️ Menjalankan deployment sebagai $APP_OWNER via sudo..."
              sudo -u "$APP_OWNER" -H bash -c "$DEPLOY_SCRIPT" || bash -c "$DEPLOY_SCRIPT"
            else
              bash -c "$DEPLOY_SCRIPT"
            fi

            echo "=========================================================="
            echo "🎉 [CI/CD] DEPLOYMENT BERHASIL! E-WARGA telah live di VPS."
            echo "=========================================================="
