name: CI/CD Pipeline & VPS Auto-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ========================================================
  # JOB 1: Continuous Integration (Test & Build)
  # ========================================================
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, curl, bcmath, zip
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Setup Environment File & Dependencies
        run: |
          cp backend/.env.example backend/.env
          cp backend/.env.example .env
          cd backend
          if [ ! -d "vendor" ]; then
            composer install --no-interaction --prefer-dist --optimize-autoloader
          fi
          php artisan key:generate
          cd ..

      - name: Install Frontend Dependencies & Build Assets
        run: |
          cd frontend
          npm ci --prefer-offline --no-audit
          npm run build
          cd ..

      - name: Execute Automated Test Suite
        run: |
          cd backend
          php artisan test --compact

  # ========================================================
  # JOB 2: Continuous Deployment to Production VPS
  # ========================================================
  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Verify SSH Credentials
        run: |
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::Secret VPS_SSH_KEY belum terpasang di GitHub Repository Secrets!"
            echo "Silakan pastikan secret VPS_SSH_KEY telah ditambahkan di https://github.com/FabianOminkk/e-warga/settings/secrets/actions"
            exit 1
          fi
          echo "✅ Secret VPS_SSH_KEY terdeteksi di GitHub Actions."

      - name: Connect to VPS and Turbo Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.157.230.29
          port: 22
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script_stop: true
          script: |
            echo "🚀 [TURBO DEPLOY] Terhubung ke VPS: $(hostname)"
            APP_DIR="/home/unique-monsters-ewarga/htdocs/e-warga.unique-monsters.my.id"

            sudo bash -c "
              set -e
              cd '$APP_DIR'

              # 1. Deteksi file yang berubah
              CHANGED=\$(git diff --name-only HEAD origin/main 2>/dev/null || echo 'all')

              # 2. Sinkronisasi kode secepat kilat
              git config core.fileMode false
              git fetch origin main --quiet
              git reset --hard origin/main --quiet

              # 3. Pastikan symlink dan .env siap
              if [ ! -f backend/.env ] && [ -f .env ]; then
                cp .env backend/.env
              fi
              if [ ! -e public ] && [ -d backend/public ]; then
                ln -s backend/public public
              fi

              # 4. Jalankan dependensi hanya jika berkas terkait berubah
              if echo \"\$CHANGED\" | grep -q 'backend/composer.lock'; then
                echo '📦 Update Composer...'
                cd backend && composer install --no-dev --optimize-autoloader --no-interaction --quiet && cd ..
              fi

              if echo \"\$CHANGED\" | grep -q 'backend/database/migrations'; then
                echo '🗄️ Update Database Migration...'
                cd backend && php artisan migrate --force --quiet && cd ..
              fi

              if echo \"\$CHANGED\" | grep -qE 'frontend/|package.json'; then
                echo '🎨 Rebuild Vite Assets...'
                cd frontend && npm run build --silent && cd ..
              fi

              # 5. Refresh cache super cepat
              cd backend
              php artisan optimize:clear --quiet
              php artisan config:cache --quiet
              php artisan route:cache --quiet
              php artisan view:cache --quiet
              cd ..

              # 6. Permission kilat
              chown -R unique-monsters-ewarga:unique-monsters-ewarga . 2>/dev/null || true
              chmod -R 775 backend/storage backend/bootstrap/cache backend/public/build 2>/dev/null || true
            "

            echo "=========================================================="
            echo "⚡ [TURBO DEPLOY] WEBSITE PRODUKSI SUDAH LIVE TERUPDATE!"
            echo "=========================================================="
