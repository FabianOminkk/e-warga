<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="856" height="540">
  <defs>
    <linearGradient id="bgKtp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="50%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  
  <!-- Base Card -->
  <rect width="856" height="540" rx="28" fill="url(#bgKtp)" stroke="#1e40af" stroke-width="4"/>
  
  <!-- Guilloche pattern watermark lines -->
  <path d="M 0 100 Q 200 40, 400 120 T 856 80 M 0 200 Q 200 140, 400 220 T 856 180 M 0 300 Q 200 240, 400 320 T 856 280 M 0 400 Q 200 340, 400 420 T 856 380" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.3"/>
  
  <!-- Header -->
  <text x="428" y="45" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="900" fill="#1e3a8a" text-anchor="middle" letter-spacing="3">REPUBLIK INDONESIA</text>
  <text x="428" y="75" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle" letter-spacing="1">PROVINSI JAWA BARAT • KOTA BANDUNG</text>
  
  <!-- NIK -->
  <text x="50" y="125" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="900" fill="#0f172a">NIK : 3275011205820001</text>
  
  <!-- Fields -->
  <g font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b">
    <text x="50" y="165">Nama</text>
    <text x="210" y="165">: BAMBANG PAMUNGKAS</text>
    
    <text x="50" y="195">Tempat/Tgl Lahir</text>
    <text x="210" y="195">: BANDUNG, 12-05-1982</text>
    
    <text x="50" y="225">Jenis Kelamin</text>
    <text x="210" y="225">: LAKI-LAKI &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Gol. Darah: O</text>
    
    <text x="50" y="255">Alamat</text>
    <text x="210" y="255">: JL. MELATI MAS IX NO. 12</text>
    
    <text x="80" y="285">RT/RW</text>
    <text x="210" y="285">: 005 / 012</text>
    
    <text x="80" y="315">Kel/Desa</text>
    <text x="210" y="315">: COBLONG</text>
    
    <text x="80" y="345">Kecamatan</text>
    <text x="210" y="345">: COBLONG</text>
    
    <text x="50" y="375">Agama</text>
    <text x="210" y="375">: ISLAM</text>
    
    <text x="50" y="405">Status Perkawinan</text>
    <text x="210" y="405">: KAWIN</text>
    
    <text x="50" y="435">Pekerjaan</text>
    <text x="210" y="435">: WIRASWASTA</text>
    
    <text x="50" y="465">Kewarganegaraan</text>
    <text x="210" y="465">: WNI</text>
    
    <text x="50" y="495">Berlaku Hingga</text>
    <text x="210" y="495">: SEUMUR HIDUP</text>
  </g>
  
  <!-- Photo Box Sisi Kanan -->
  <rect x="620" y="140" width="180" height="230" rx="12" fill="#ef4444" stroke="#dc2626" stroke-width="3"/>
  <circle cx="710" cy="210" r="45" fill="#fecaca"/>
  <path d="M 650 350 C 650 280, 770 280, 770 350 Z" fill="#1e293b"/>
  <text x="710" y="390" font-family="Arial" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">KOTA BANDUNG</text>
  <text x="710" y="410" font-family="Arial" font-size="11" fill="#475569" text-anchor="middle">12-05-2018</text>

  <!-- Chip RFID Watermark -->
  <rect x="660" y="430" width="100" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="710" y="455" font-family="monospace" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">RFID E-KTP</text>
  
  <!-- Stamp Terverifikasi RW -->
  <g transform="rotate(-12 600 480)">
    <rect x="420" y="450" width="220" height="46" rx="8" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 3"/>
    <text x="530" y="480" font-family="'Plus Jakarta Sans', Arial" font-size="13" font-weight="900" fill="#16a34a" text-anchor="middle">✓ DI-ACC KETUA RW</text>
  </g>
</svg>

