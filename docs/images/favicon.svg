<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B365D"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle Navy -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Sinyal Smart IoT / Wi-Fi di Puncak Atap (Cyan Glow) -->
  <circle cx="32" cy="14" r="3" fill="#38BDF8"/>
  <path d="M24 18 C28 14.5, 36 14.5, 40 18" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Atap Rumah Utama (Putih Bersih) -->
