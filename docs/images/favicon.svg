  <!-- Simbol Jabat Tangan / Sinergi di Tengah (Cyan) -->
  <path d="M25 41 L30 45 L34 41 L39 44" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

